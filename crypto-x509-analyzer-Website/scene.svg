<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="The grove in three strata: stalks swaying and knocking once in the rear stratum while daylight shafts drift, pools rippling as droplets land in the middle stratum, and the sliced stalk in the front stratum gathering a droplet at its rim until one falls">
