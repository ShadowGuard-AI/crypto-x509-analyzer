<polygon points="330,262 372,252 382,266 344,274" fill="#968c4a"/>
<g><line x1="742" y1="292" x2="800" y2="222" stroke="#3e8040" stroke-width="15" stroke-linecap="round"/><g><circle cx="736" cy="282" r="17" fill="#d8a434"/><circle cx="736" cy="282" r="10" fill="#f0da96"/><circle cx="736" cy="282" r="4" fill="#faf4dc"/></g><circle cx="752" cy="262" r="3" fill="#87b4d7"><animate attributeName="r" values="1.5;4;4" dur="5s" repeatCount="indefinite"/><animate attributeName="cy" values="262;262;292" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="5s" repeatCount="indefinite"/></circle></g>
