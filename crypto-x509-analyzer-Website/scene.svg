<g stroke="#265c28" stroke-width="2.4"><line x1="80" y1="86" x2="100" y2="86"/><line x1="170" y1="104" x2="190" y2="104"/><line x1="610" y1="96" x2="630" y2="96"/><line x1="780" y1="110" x2="800" y2="110"/><line x1="830" y1="90" x2="850" y2="90"/></g>
<path d="M330 200 L570 200 L700 300 L200 300 Z" fill="#949694"/>
<g fill="#87b4d7"><ellipse cx="400" cy="252" rx="52" ry="13"><animate attributeName="rx" values="52;56;52" dur="6s" repeatCount="indefinite"/></ellipse><ellipse cx="560" cy="272" rx="66" ry="15"/></g>
