<g fill="#ffffff" opacity="0.35"><polygon points="120,0 190,0 150,190 90,190"><animate attributeName="opacity" values="0.2;0.45;0.2" dur="16s" repeatCount="indefinite"/></polygon><polygon points="430,0 500,0 460,190 400,190"><animate attributeName="opacity" values="0.45;0.2;0.45" dur="19s" repeatCount="indefinite"/></polygon><polygon points="700,0 770,0 730,190 670,190"><animate attributeName="opacity" values="0.2;0.45;0.2" dur="22s" repeatCount="indefinite"/></polygon></g>
